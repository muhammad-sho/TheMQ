services:
  themq:
    image: ghcr.io/muhammad-sho/themq:latest
    container_name: themq
    hostname: themq
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Pinned API token (used as the n8n credential + Bearer token).
      # Override without editing: API_TOKEN=your-own-token docker compose up -d
      # Change this value for any non-local deployment.
      API_TOKEN: ${API_TOKEN:-VoUZ9gJutnb8WEKyAYS5m2yVViEVb6L3aOzWMEtEuSo}

  redis:
    image: redis:7-alpine
    container_name: themq-redis
    hostname: themq-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
